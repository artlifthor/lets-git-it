# Refreshes the PAP National Records page from PAP's official sheet once a month.
# Publishes automatically when the safety checks pass; otherwise opens an issue and publishes nothing.
name: PAP records refresh

on:
  schedule:
    - cron: '0 1 1 * *' # 1st of each month, 09:00 Philippine time
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Download and check PAP records
        id: update
        run: |
          set +e
          npm run pap:update
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Report blocked update
        if: steps.update.outputs.code == '2'
        run: gh issue create --title "PAP records update blocked" --body-file pap-problems.md

      - name: Fail on unexpected error
        if: steps.update.outputs.code != '0' && steps.update.outputs.code != '2'
        run: exit 1

      - name: Publish new records
        if: steps.update.outputs.code == '0' && steps.update.outputs.changed == 'true'
        run: |
          npm test
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/pap-records/records.json
          git commit -m "Update PAP records (${{ steps.update.outputs.summary }})"
          git push
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy directly.
          gh workflow run deploy.yml
